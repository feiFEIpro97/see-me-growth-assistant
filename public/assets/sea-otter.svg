<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#e3eef8"/>
      <stop offset="100%" stop-color="#b7d3e9"/>
    </radialGradient>
    <radialGradient id="fur" cx="40%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#c9a076"/>
      <stop offset="100%" stop-color="#a67b5b"/>
    </radialGradient>
    <radialGradient id="belly" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#f2e3cd"/>
      <stop offset="100%" stop-color="#e3c9a8"/>
    </radialGradient>
  </defs>

  <!-- 背景 -->
  <circle cx="100" cy="100" r="96" fill="url(#bg)"/>

  <!-- 水波纹 -->
  <ellipse cx="100" cy="168" rx="66" ry="12" fill="#88b0d6" opacity="0.5"/>
  <ellipse cx="100" cy="176" rx="46" ry="8" fill="#4a7ba6" opacity="0.35"/>

  <!-- 身体 -->
  <ellipse cx="100" cy="118" rx="52" ry="44" fill="url(#fur)"/>

  <!-- 肚皮 -->
  <ellipse cx="100" cy="126" rx="34" ry="30" fill="url(#belly)"/>

  <!-- 头 -->
  <circle cx="100" cy="72" r="40" fill="url(#fur)"/>

  <!-- 耳朵 -->
  <circle cx="66" cy="46" r="13" fill="#8a5e35"/>
  <circle cx="134" cy="46" r="13" fill="#8a5e35"/>
  <circle cx="66" cy="46" r="7" fill="#e3c9a8"/>
  <circle cx="134" cy="46" r="7" fill="#e3c9a8"/>

  <!-- 脸部奶白区域 -->
  <ellipse cx="100" cy="82" rx="30" ry="22" fill="#f2e3cd"/>

  <!-- 眼睛 -->
  <circle cx="86" cy="70" r="6.5" fill="#4a3626"/>
  <circle cx="114" cy="70" r="6.5" fill="#4a3626"/>
  <circle cx="88" cy="68" r="2.2" fill="#fff"/>
  <circle cx="116" cy="68" r="2.2" fill="#fff"/>

  <!-- 腮红 -->
  <ellipse cx="76" cy="84" rx="7" ry="5" fill="#e8a0a0" opacity="0.55"/>
  <ellipse cx="124" cy="84" rx="7" ry="5" fill="#e8a0a0" opacity="0.55"/>

  <!-- 鼻子 -->
  <ellipse cx="100" cy="82" rx="5" ry="4" fill="#6b4a2f"/>

  <!-- 微笑 -->
  <path d="M88 92 Q100 102 112 92" stroke="#6b4a2f" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- 前爪（怀抱星星） -->
  <ellipse cx="78" cy="112" rx="12" ry="9" fill="#8a5e35" transform="rotate(-15 78 112)"/>
  <ellipse cx="122" cy="112" rx="12" ry="9" fill="#8a5e35" transform="rotate(15 122 112)"/>

  <!-- 星星 -->
  <path d="M100 96 L104 106 L115 107 L107 114 L109 125 L100 120 L91 125 L93 114 L85 107 L96 106 Z" fill="#fff7d6" stroke="#c9a076" stroke-width="1.5"/>
  <path d="M100 96 L104 106 L115 107 L107 114 L109 125 L100 120 L91 125 L93 114 L85 107 L96 106 Z" fill="#ffe9a8" opacity="0.6"/>

  <!-- 尾巴 -->
  <path d="M60 150 Q48 158 52 168 Q96 166 100 158" fill="#a67b5b" stroke="#8a5e35" stroke-width="2"/>
</svg>