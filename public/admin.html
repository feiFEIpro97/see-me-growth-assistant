<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>see-me 后台管理</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%97%BA%3C/text%3E%3C/svg%3E" />
  <style>
    :root {
      --brown-700:#8a5e35; --brown-500:#a67b5b; --brown-200:#e3c9a8; --brown-100:#f2e3cd;
      --blue-700:#4a7ba6; --blue-500:#88b0d6; --blue-100:#e3eef8; --bg:#f7efe3;
      --text:#4a3626; --text-soft:#8a7458; --white:#fff;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif; background:linear-gradient(160deg,var(--brown-100),var(--bg) 45%,var(--blue-100)); color:var(--text); min-height:100vh; }
    .wrap { max-width:1100px; margin:0 auto; padding:24px 20px 60px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:20px; flex-wrap:wrap; }
    .brand { font-size:22px; font-weight:800; color:var(--brown-700); display:flex; align-items:center; gap:10px; }
    .brand img { width:36px; height:36px; }
    .sub { font-size:13px; color:var(--text-soft); }
    /* 登录 */
    .login-card { max-width:380px; margin:80px auto; background:var(--white); border-radius:18px; padding:32px; box-shadow:0 10px 30px rgba(107,74,47,.15); border:1.5px solid var(--brown-200); text-align:center; }
    .login-card h2 { color:var(--brown-700); margin-bottom:18px; }
    .login-card input { width:100%; padding:12px 14px; border:2px solid var(--brown-200); border-radius:10px; font-size:15px; margin-bottom:14px; outline:none; }
    .login-card input:focus { border-color:var(--brown-500); }
    .btn { border:none; cursor:pointer; border-radius:10px; padding:12px 20px; font-size:15px; font-weight:600; font-family:inherit; }
    .btn-primary { background:linear-gradient(135deg,var(--brown-500),var(--brown-700)); color:#fff; width:100%; }
    .btn-primary:hover { filter:brightness(1.06); }
    .btn-ghost { background:#eee; color:var(--text); }
    .err { color:#c0392b; font-size:14px; margin-top:8px; min-height:18px; }
    /* 主界面 */
    .hidden { display:none; }
    .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; margin-bottom:24px; }
    .stat { background:var(--white); border-radius:14px; padding:18px; border:1.5px solid var(--brown-200); box-shadow:0 4px 14px rgba(107,74,47,.08); }
    .stat .num { font-size:32px; font-weight:800; color:var(--blue-700); }
    .stat .label { font-size:13px; color:var(--text-soft); margin-top:4px; }
    .toolbar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
    .toolbar h3 { color:var(--brown-700); }
    .refresh { background:var(--blue-100); color:var(--blue-700); border:1.5px solid var(--blue-500); }
    .refresh:hover { background:#d2e6f5; }
    .sessions { background:var(--white); border-radius:14px; border:1.5px solid var(--brown-200); overflow:hidden; }
    .sess-row { display:grid; grid-template-columns:1.2fr .8fr .8fr .6fr .6fr auto; gap:10px; padding:14px 18px; border-bottom:1px solid #eee; align-items:center; cursor:pointer; transition:background .15s; }
    .sess-row:last-child { border-bottom:none; }
    .sess-row:hover { background:var(--brown-100); }
    .sess-row.head { background:var(--brown-100); font-weight:700; cursor:default; }
    .sess-row .uid { font-family:monospace; font-size:13px; color:var(--blue-700); word-break:break-all; }
    .sess-row .time { font-size:12px; color:var(--text-soft); }
    .chapter-badge { background:var(--blue-100); color:var(--blue-700); border-radius:999px; padding:2px 10px; font-size:12px; font-weight:600; }
    .empty { text-align:center; color:var(--text-soft); padding:40px; }
    /* 详情 */
    .backbar { display:flex; align-items:center; gap:12px; margin-bottom:16px; }
    .backbar h3 { color:var(--brown-700); }
    .thread { background:var(--white); border-radius:14px; border:1.5px solid var(--brown-200); padding:18px; }
    .mt { display:flex; gap:10px; margin-bottom:16px; }
    .mt .who { flex-shrink:0; width:56px; font-size:12px; font-weight:700; text-align:center; border-radius:8px; padding:6px 0; align-self:flex-start; }
    .mt.user .who { background:var(--blue-100); color:var(--blue-700); }
    .mt.ai .who { background:var(--brown-100); color:var(--brown-700); }
    .mt .body { flex:1; background:#fafafa; border-radius:10px; padding:12px 14px; font-size:14px; line-height:1.7; white-space:pre-wrap; word-break:break-word; }
    .mt .meta { font-size:11px; color:var(--text-soft); margin-top:4px; }
    .mt.ai .body { white-space:normal; }
    .mt.ai .body h3,.mt.ai .body h4 { color:var(--brown-700); margin:8px 0 4px; }
    .mt.ai .body ul { margin:4px 0 4px 18px; }
    .toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--brown-700); color:#fff; padding:10px 22px; border-radius:999px; font-size:14px; opacity:0; pointer-events:none; transition:all .3s; z-index:99; }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
    @media (max-width:600px){ .sess-row { grid-template-columns:1fr; gap:4px; } }
  </style>
</head>
<body>
  <!-- 登录 -->
  <div id="login-view">
    <div class="login-card">
      <img src="assets/sea-otter.svg" alt="海獭" style="width:70px;height:70px;margin-bottom:10px;" />
      <h2>see-me 后台管理</h2>
      <input id="pwd" type="password" placeholder="请输入管理密码" />
      <button class="btn btn-primary" id="btn-login">进入后台</button>
      <div class="err" id="login-err"></div>
    </div>
  </div>

  <!-- 主界面 -->
  <div id="main-view" class="hidden">
    <div class="wrap">
      <header>
        <div class="brand"><img src="assets/sea-otter-mini.svg" alt=""/>see-me 后台 · 探索数据</div>
        <span class="sub" id="db-status"></span>
      </header>

      <div class="stats" id="stats"></div>

      <div class="toolbar">
        <h3>📋 用户会话列表</h3>
        <button class="btn refresh" id="btn-refresh">⟳ 刷新</button>
      </div>

      <div id="list-view">
        <div class="sessions" id="sessions-box"></div>
      </div>

      <div id="detail-view" class="hidden">
        <div class="backbar">
          <button class="btn btn-ghost" id="btn-back">← 返回列表</button>
          <h3 id="detail-title"></h3>
        </div>
        <div class="thread" id="thread"></div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <script src="admin.js"></script>
</body>
</html>
